<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Premium SEO Metadata -->
    <title>DADZY | Premium Menswear & Couture for the Modern Patriarch</title>
    <meta name="description" content="Discover DADZY, an ultra-premium menswear catalog tailored exclusively for distinguished patriarchs. Sourced from the finest Biella wool mills and mulberry silk." />
    <meta name="keywords" content="luxury menswear for older men, premium linen trousers, tailored blazer senior, Mulberry silk polo shirt, Dadzy couture, high-end patriarch fashion" />
    <meta name="author" content="Vimal Parmar Collections" />

    <!-- Open Graph (Social Sharing) -->
    <meta property="og:title" content="DADZY | Premium Menswear for the Modern Patriarch" />
    <meta property="og:description" content="Sartorial excellence, double-pleated trousers, and organic linen-wool shirts designed for mature silhouettes." />
    <meta property="og:type" content="website" />
    
    <!-- JSON-LD Structured Schema (SEO, AEO, GEO) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "DADZY",
        "image": "https://ai.studio/build/assets/logo.png",
        "description": "Ultra-premium menswear e-commerce application designed for distinguished patriarchs.",
        "parentOrganization": {
          "@type": "Organization",
          "name": "Vimal Parmar Collections"
        },
        "priceRange": "$$$$",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Mumbai",
          "addressRegion": "MH",
          "addressCountry": "IN"
        },
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Dadzy Sartorial Collection",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Product",
                "name": "The Atelier Silk-Cotton Polo",
                "category": "Elite Knitwear",
                "material": "Mulberry Silk, Giza Cotton"
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Product",
                "name": "The Tailored Blazer Jacket",
                "category": "Couture Jackets",
                "material": "Linen-Wool Blend"
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Product",
                "name": "The Sartorial Pleated Trouser",
                "category": "Dad's Trousers",
                "material": "Italian Flax Linen, Virgin Merino Wool"
              }
            }
          ]
        }
      }
    </script>
  </head>
  <body class="bg-bg-main text-text-main">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
